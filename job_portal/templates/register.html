{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - Job Portal</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

<nav>
  <h1>Job Portal System</h1>
</nav>

<div class="container">
  <h2>Register</h2>

  <form id="registerForm" action="" method="POST">
    {% csrf_token %}
   
    <label>Full Name <span style="color:#e74c3c;">*</span></label>
    <input type="text" name="name" id="regName" required>

    <label>Email <span style="color:#e74c3c;">*</span></label>
    <input type="email" name="email" id="regEmail" required>

    <label>Password <span style="color:#e74c3c;">*</span></label>
    <input type="password" name="password" id="regPassword" required>

    <label>Role <span style="color:#e74c3c;">*</span></label>
    <select name="role" id="regRole" required>
      <option value="">Select your role</option>
      <option value="jobseeker">Job Seeker</option>
      <option value="recruiter">Recruiter</option>
    </select>

    <!-- Company Name – hidden by default -->
    <div id="companyRow" style="display: none; margin-top: 1.2rem;">
      <label>Company Name <span style="color:#e74c3c;">*</span></label>
      <input type="text" name="company_name" id="regCompany" placeholder="e.g. Tech Solutions Pvt Ltd" required>
    </div>

    <button type="submit">Register</button>
  </form>

  <p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
</div>

<script src="{% static 'js/script.js' %}"></script>

<script>
// Show/hide company name field only for recruiters
const roleSelect = document.getElementById('regRole');
const companyRow = document.getElementById('companyRow');

if (roleSelect && companyRow) {
  roleSelect.addEventListener('change', function() {
    if (this.value === 'recruiter') {
      companyRow.style.display = 'block';
      // The input inside is already required → browser will enforce it
    } else {
      companyRow.style.display = 'none';
      // Optional: clear the value when hidden
      document.getElementById('regCompany').value = '';
    }
  });

  // Trigger once on page load (important if browser remembers previous selection)
  roleSelect.dispatchEvent(new Event('change'));
}
</script>
</body>
</html>
