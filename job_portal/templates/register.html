{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title> {% block title %} Register - Job Portal {% endblock %}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
  <nav>
    <div class="nav-content">
      <div class="nav-center">
        <h1>Job Portal System</h1>
      </div>
      <div class="right-side">
        <p><i class="fas fa-briefcase"></i> Find jobs or hire candidates easily</p>
      </div>
    </div>
  </nav>

  <div class="container">
    <h2><i class="fas fa-user-plus"></i> Register</h2>

    {% if error %}
    <div class="error-message">
      <i class="fas fa-exclamation-circle"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <label><i class="fas fa-user"></i> Full Name <span class="required">*</span></label>
      <input type="text" name="name" required placeholder="Enter your full name">

      <label><i class="fas fa-envelope"></i> Email <span class="required">*</span></label>
      <input type="email" name="email" required placeholder="Enter your email">

      <label><i class="fas fa-lock"></i> Password <span class="required">*</span></label>
      <input type="password" name="password" required placeholder="Create a password">

      <label>Confirm Password *</label>
      <input type="password" name="confirm_password" required placeholder="Confirm your password">

      <label><i class="fas fa-key"></i> Contact <span class="required">*</span></label>
      <input type="tel" name="contact" required placeholder="Enter your contact number">

      <label><i class="fas fa-user-tag"></i> Role <span class="required">*</span></label>
      <select name="role" id="regRole" required>
        <option value="">Select your role</option>
        <option value="job_seeker">Job Seeker</option>
        <option value="recruiter">Recruiter</option>
      </select>

      <div id="companyRow" style="display:none;">
        <label><i class="fas fa-building"></i> Company Name <span class="required">*</span></label>
        <input type="text" name="company_name" id="regCompany" placeholder="Enter your company name">
      </div>

      <button type="submit">
        <i class="fas fa-user-plus"></i> Register
      </button>
    </form>

    <p>
      Already have an account? <a href="{% url 'login' %}"><i class="fas fa-sign-in-alt"></i> Login</a>
    </p>
  </div>

  <script>
    const roleSelect = document.getElementById('regRole');
    const companyRow = document.getElementById('companyRow');

    roleSelect.addEventListener('change', function () {
      if (this.value === 'recruiter') {
        companyRow.style.display = 'block';
      } else {
        companyRow.style.display = 'none';
        document.getElementById('regCompany').value = '';
      }
    });
  </script>

</body>

</html>
