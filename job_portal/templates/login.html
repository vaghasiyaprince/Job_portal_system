{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Job Portal</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

<nav>
  <div class="nav-content">

    <!-- Centered title -->
    <div class="nav-center">
      <h1>Job Portal System</h1>
    </div>

    <!-- Right side: tagline + welcome + logout -->
    <div class="right-side">
      <p>Find jobs or hire candidates easily</p>

      <!-- <div class="user-info">
        <span>Welcome, <strong>{{ user.name }}</strong></span>
        <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
      </div> -->
    </div>

  </div>
</nav>

<div class="container">
  <h2>Login</h2>
  <!-- {% if error %}
  <p style="color:red;">{{ error }}</p>
  {% endif %} -->


  {% if form.non_field_errors %}
    <p style="color:red;">{{ form.non_field_errors }}</p> <!--modified by hitesh-->
  {% endif %}

  <form method="POST">
    {% csrf_token %}

    <input type="hidden" name="role" value="{{ request.GET.role }}">

      <label>Email <span class="required">*</span></label>
      <input type="email" name="email" required>

      <label>Password <span class="required">*</span></label>
      <input type="password" name="password" required>

    <button type="submit">Login</button>
  </form>

  <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
</div>

</body>
</html>
