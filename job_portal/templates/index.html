{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Portal System</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  </head>
  <body>
    <nav>
      <div class="nav-content">
        <h1>Job Portal System</h1>
        <h3>Find jobs or hire candidates easily</h3>
      </div>
    </nav>

    <div class="landing-container">
      <h2>Welcome to Job Portal</h2>
      <p>Please select your role to continue</p>

      <div class="role-buttons">
        <a href="{% url 'jobseeker-dashboard' %}" class="big-btn jobseeker">I'm a Job Seeker</a>
        <a href="{% url 'recruiter-dashboard' %}" class="big-btn recruiter">I'm a Recruiter</a>
      </div>

      <p class="small-link">
        Don't have an account? <a href="{% url 'register' %}">Register here</a>
      </p>
    </div>
  </body>
</html>
