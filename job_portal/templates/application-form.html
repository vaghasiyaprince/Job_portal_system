{% load static %}

<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Apply for Job</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
</head>

<body>
  <nav>
    <div class="nav-content">

      <!-- Centered title -->
      <div class="nav-center">
        <h1>Job Portal System</h1>
      </div>

      <!-- Right side: tagline + welcome + logout -->
      <div class="right-side">
        <!-- <p>Find jobs or hire candidates easily</p> -->

        <div class="user-info">
          <!-- <span>Welcome <strong>{{ user.name }}</strong></span> <br> <br> -->
          <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
        </div>
      </div>

    </div>
  </nav>

  <div class="container">
    <h2>Application Form</h2>

   
    <form action="{% url 'apply_job' job.id %}" method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      {{ form.as_p }}

      <p>You are applying as: <b>{{ request.session.user_email }}</b></p>

      <!-- <label>Why do you want to join?</label>
      <textarea name="reason_to_join" required></textarea>

      <label>Resume</label>
      <input type="file" name="resume" required> -->

      <button type="submit">Submit Application</button>
    </form>

    <br />
    <a href="{% url 'job_detail' job.id %}" class="btn">Back</a>
  </div>

  <script src="script.js"></script>
  <script>
    document.getElementById("applicantName").textContent =
      getCurrentUser()?.name || "Guest";
  </script>
</body>

</html>
