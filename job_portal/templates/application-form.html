{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Apply for Job</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  </head>
  <body>
    <nav>
  <div class="nav-content">

    <!-- Centered title -->
    <div class="nav-center">
      <h1>Job Portal System</h1>
    </div>

    <!-- Right side: tagline + welcome + logout -->
    <div class="right-side">
      <!-- <p>Find jobs or hire candidates easily</p> -->

      <div class="user-info">
        <!-- <span>Welcome <strong>{{ user.name }}</strong></span> <br> <br> -->
        <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
      </div>
    </div>

  </div>
</nav>

    <div class="container">
      <h2>Application Form</h2>

      <!-- <form id="applyForm" action="{% url 'submit_application' job_id %}" method="POST" enctype="multipart/form-data"> -->
      <form ... action="{% url 'submit_application' job_id %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}


        <p>You are applying as: <b id="applicantName"></b></p>

        <!-- You can add more fields if you want real data collection -->
        <label>Why do you want to join?</label>
        <textarea
          placeholder="Tell us why you're a great fit..."
          required
        ></textarea>

        <label>Resume (simulation)</label>
        <input type="file" placeholder="Upload resume (not saved)" />

        <button type="submit">Submit Application</button>
      </form>

      <br />
      <a href="job-details.html" class="btn">Back</a>
    </div>

    <script src="script.js"></script>
    <script>
      document.getElementById("applicantName").textContent =
        getCurrentUser()?.name || "Guest";
    </script>
  </body>
</html>
