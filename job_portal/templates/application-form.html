{% load static %}

<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title> {% block title %} Apply for Job {% endblock %}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
</head>

<body>
  <nav>
    <div class="nav-content">
      <div class="nav-center">
        <h1>Job Portal System</h1>
      </div>
      <div class="right-side">
        <div class="user-info">
          {% if request.session.user_type %}
          <span><i class="fas fa-user-circle"></i> Welcome, {{ request.session.user_name }}</span>
          {% endif %}
          <a href="{% url 'logout' %}" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <h2><i class="fas fa-file-alt"></i> Application Form</h2>

    <form action="{% url 'apply_job' job.id %}" method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      {{ form.as_p }}

      <div class="info-box">
        <p><i class="fas fa-info-circle"></i> You are applying as: <strong>{{ request.session.user_email }}</strong></p>
      </div>

      <button type="submit">
        <i class="fas fa-paper-plane"></i> Submit Application
      </button>
    </form>

    <br />
    <a href="{% url 'job_detail' job.id %}" class="btn-back">
      <i class="fas fa-arrow-left"></i> Back
    </a>
  </div>
</body>

</html>
