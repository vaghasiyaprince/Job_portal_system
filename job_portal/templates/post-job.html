{% load static %}
{% if error %}
<div class="error-message">
  <i class="fas fa-exclamation-circle"></i> {{ error }}
</div>
{% endif %}
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Post a Job</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
  <nav>
    <div class="nav-content">
      <div class="nav-center">
        <h1>Job Portal System</h1>
      </div>
      <div class="right-side">
        <div class="user-info">
          {% if request.session.user_type %}
          <span><i class="fas fa-user-circle"></i> Welcome, {{ request.session.user_name }}</span>
          {% endif %}
          <a href="{% url 'logout' %}" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <h2><i class="fas fa-plus-circle"></i> Post New Job</h2>

    <form method="POST">
      {% csrf_token %}

      <label><i class="fas fa-briefcase"></i> Job Title <span class="required">*</span></label>
      <input type="text" name="job_title" required placeholder="e.g. Senior Software Engineer">

      <label><i class="fas fa-building"></i> Company Name <span class="required">*</span></label>
      <input type="text" name="company_name" required placeholder="e.g. Google, Microsoft">

      <label><i class="fas fa-code"></i> Skills Required <span class="required">*</span></label>
      <input type="text" name="skills_required" required placeholder="React, Node.js, AWS, Python">

      <label><i class="fas fa-align-left"></i> Job Description <span class="required">*</span></label>
      <textarea name="job_description" required rows="6"
        placeholder="Describe the job role, responsibilities, and requirements..."></textarea> <br> <br>

      <button type="submit">
        <i class="fas fa-paper-plane"></i> Post Job
      </button>
    </form> <br> <br>

    <a href="{% url 'recruiter_dashboard' %}" class="btn-back">
      <i class="fas fa-arrow-left"></i> Back to Dashboard
    </a>
  </div>
</body>

</html>
