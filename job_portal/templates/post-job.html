<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Post a Job</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav><h1>Post a Job</h1></nav>

    <div class="container">
      <h2>Post New Job</h2>

      <form id="postJobForm">
        <label>Job Title</label>
        <input type="text" id="jobTitle" required />

        <label>Company Name</label>
        <input type="text" id="companyName" required />

        <label>Category</label>
        <select id="jobCategory" required>
          <option value="">Select category</option>
          <option>Core Software Development Roles</option>
          <option>Data & AI Related Roles</option>
          <option>Security & Networking Roles</option>
          <option>Cloud & Infrastructure Roles</option>
        </select>

        <label>Skills Required (comma separated)</label>
        <input
          type="text"
          id="skills"
          required
          placeholder="React, Node.js, AWS"
        />

        <label>Job Description</label>
        <textarea id="description" required rows="6"></textarea>

        <button type="submit">Post Job</button>
      </form>

      <a href="recruiter-dashboard.html" class="btn">Back</a>
    </div>

    <script src="script.js"></script>
  </body>
</html>
