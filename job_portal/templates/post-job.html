{% load static %}
{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Post a Job</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
  <nav>
  <div class="nav-content">

    <!-- Centered title -->
    <div class="nav-center">
      <h1>Job Portal System</h1>
    </div>

    <!-- Right side: tagline + welcome + logout -->
    <div class="right-side">
      <!-- <p>Find jobs or hire candidates easily</p> -->

      <div class="user-info">
        <!-- <span>Welcome <strong>{{ user.name }}</strong></span> <br> <br> -->
        <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
      </div>
    </div>

  </div>
</nav>



<!-- <nav><h1>Post a Job</h1></nav> -->

<div class="container">
  <h2>Post New Job</h2>

  <form method="POST">
    {% csrf_token %}

    <label>Job Title <span class="required">*</span></label>
    <input type="text" name="job_title" required>

    <label>Company Name <span class="required">*</span></label>
    <input type="text" name="company_name" required>

    <label>Skills Required (comma separated) <span class="required">*</span></label>
    <input
      type="text"
      name="skills_required"
      required
      placeholder="React, Node.js, AWS"
    >

    <label>Job Description <span class="required">*</span></label>
    <textarea name="job_description" required rows="6"></textarea> <br> <br>

    <button type="submit">Post Job</button>
  </form> <br> <br>

  <a href="{% url 'recruiter_dashboard' %}" class="btn">Back to Dashboard</a>
</div>

</body>
</html>
