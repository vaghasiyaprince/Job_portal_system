{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Applicant Details</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  </head>
  <body>
    <nav>
      <h1>Job Portal - Recruiter</h1>
      <a href="{% url 'logout' %}" class="btn">Logout</a>
    </nav>

    <div class="container">
      <h2>Applicant Details</h2>

      <div id="applicantInfo">
        <!-- Filled by JS if you want to make it dynamic -->
        <p><strong>Name:</strong> <span id="appName"></span></p>
        <p><strong>Email:</strong> <span id="appEmail"></span></p>
        <p><strong>Applied for:</strong> <span id="appJob"></span></p>
        <p><strong>Applied on:</strong> <span id="appDate"></span></p>
      </div>

      <button onclick="alert('Resume download simulation')">
        Download Resume
      </button>

      <br /><br />
      <a href="{% url 'applicants-list' %}" class="btn">Back to Applicants</a>
    </div>

    <script src="script.js"></script>
    <script>
      // Very basic simulation — in real project you'd pass ?id= via URL
      // For demo we'll show last applicant or placeholder
      const apps = getApplications();
      if (apps.length > 0) {
        const last = apps[apps.length - 1];
        const jobs = getJobs();
        const job = jobs.find((j) => j.id === last.jobId);

        document.getElementById("appName").textContent = last.name;
        document.getElementById("appEmail").textContent = last.applicantEmail;
        document.getElementById("appJob").textContent = job
          ? job.title
          : "Unknown Job";
        document.getElementById("appDate").textContent = new Date(
          last.appliedAt,
        ).toLocaleString();
      } else {
        document.getElementById("applicantInfo").innerHTML =
          "<p>No applicant data available.</p>";
      }
    </script>
  </body>
</html>
